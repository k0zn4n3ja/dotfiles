# hyprlock — "info-rich HUD" lock screen (Catppuccin Mocha)
#
# Background is a frame of the LIVE wallpaper, refreshed at lock time by
# ~/.config/hypr/scripts/lock-bg.sh (run via lock.sh, wired to Super+L and
# hypridle).  Layout:
#     top-left   : big clock, date, greeting
#     top-right  : battery, uptime, keyboard layout
#     center     : avatar, now-playing, password field
#
# Mocha palette: bg #1e1e2e  text #cdd6f4  subtext #a6adc8/#9399b2
#                blue #89b4fa  green #a6e3a1  red #f38ba8  overlay #6c7086

# Monitor-scaled font sizes ($s_*) + random obscuring glyph ($dot), regenerated
# each lock by lock-dyn.sh (run from lock.sh before hyprlock launches).
source = ~/.cache/hyprlock-dyn.conf

background {
    monitor =
    path = ~/.cache/hyprlock-bg.jpg     # live wallpaper frame (falls back to gatsu.jpeg)
    blur_passes = 4
    blur_size = 7
    noise = 0.0117
    contrast = 0.9
    brightness = 0.55
    vibrancy = 0.20
    vibrancy_darkness = 0.4
}

general {
    hide_cursor = true
    grace = 2
    ignore_empty_input = true
}

################################################################################
# TOP-LEFT — clock / date / greeting
################################################################################
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    font_size = $s_clock
    font_family = JetBrainsMono Nerd Font ExtraBold
    color = rgba(cdd6f4ff)
    position = $clk_x, $clk_y
    halign = left
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    font_size = $s_head
    font_family = JetBrainsMono Nerd Font
    color = rgba(a6adc8ff)
    position = $dat_x, $dat_y
    halign = left
    valign = top
}

label {
    monitor =
    text = cmd[update:3600000] echo "$(h=$(date +%H); if [ $h -lt 12 ]; then echo 'Good morning'; elif [ $h -lt 18 ]; then echo 'Good afternoon'; else echo 'Good evening'; fi), nixdt1"
    font_size = $s_body
    font_family = JetBrainsMono Nerd Font
    color = rgba(89b4faff)
    position = $grt_x, $grt_y
    halign = left
    valign = top
}

################################################################################
# TOP-RIGHT — battery / uptime / keyboard layout
################################################################################
label {
    monitor =
    text = cmd[update:30000] ~/.config/hypr/scripts/lock-battery.sh
    font_size = $s_bat
    font_family = JetBrainsMono Nerd Font
    color = rgba(a6e3a1ff)
    position = $bat_x, $bat_y
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/lock-uptime.sh
    font_size = $s_body
    font_family = JetBrainsMono Nerd Font
    color = rgba(a6adc8ff)
    position = $upt_x, $upt_y
    halign = right
    valign = top
}

label {
    monitor =
    text =    $LAYOUT
    font_size = $s_body
    font_family = JetBrainsMono Nerd Font
    color = rgba(9399b2ff)
    position = $lay_x, $lay_y
    halign = right
    valign = top
}

################################################################################
# CENTER — now-playing / password
################################################################################
# now playing (blank when nothing is playing)
label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/scripts/lock-nowplaying.sh
    font_size = $s_body
    font_family = JetBrainsMono Nerd Font
    color = rgba(89b4faff)
    position = 0, $npl_y
    halign = center
    valign = center
}

# persistent lock icon, pinned just left of the password field (never hides)
label {
    monitor =
    text = $lock
    font_size = $s_head
    font_family = JetBrainsMono Nerd Font Mono
    color = rgba(a6adc8ff)
    position = $lock_x, $inp_y
    halign = center
    valign = center
}

# password field — frosted-glass pill
input-field {
    monitor =
    size = $inp_w, $inp_h
    position = 0, $inp_y
    halign = center
    valign = center
    rounding = 0                        # square corners, no rounding
    outline_thickness = 0               # no border

    inner_color = rgba(30, 30, 46, 0.22)   # mostly see-through: the blurred wallpaper shows with a faint tint
    font_color  = rgba(cdd6f4ff)
    font_family = JetBrainsMono Nerd Font

    # obscuring character: a random weird glyph ($dot), new each lock, in place of dots
    dots_size = 0.4
    dots_spacing = 0.3
    dots_center = true
    dots_text_format = $dot

    # state colours: green when accepted, red on fail, yellow on caps lock
    check_color    = rgba(a6e3a1ff)
    fail_color     = rgba(f38ba8ff)
    capslock_color = rgba(f9e2afff)

    # soft drop shadow for depth
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(00000055)
    shadow_boost = 1.2

    placeholder_text =
    fail_text = <span foreground="##f38ba8"><i>  Wrong — $ATTEMPTS</i></span>
    fade_on_empty = false
}
