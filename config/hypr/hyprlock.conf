# hyprlock — Catppuccin Mocha "frosted glass" lock screen
# swap the avatar/background paths below to taste.

background {
    monitor =
    path = ~/Pictures/gatsu.jpeg
    blur_passes = 4
    blur_size = 7
    noise = 0.0117
    contrast = 0.9
    brightness = 0.55
    vibrancy = 0.20
    vibrancy_darkness = 0.4
}

general {
    hide_cursor = true
    grace = 2
    ignore_empty_input = true
}

# ── Avatar (circle) ───────────────────────────────────────────────
image {
    monitor =
    path = ~/Pictures/berserk.jpg
    size = 130
    rounding = -1                 # -1 = full circle
    border_size = 3
    border_color = rgba(89b4faff) # Mocha blue
    position = 0, 250
    halign = center
    valign = center
}

# ── Greeting (time-aware) ─────────────────────────────────────────
label {
    monitor =
    text = cmd[update:3600000] echo "$(h=$(date +%H); if [ $h -lt 12 ]; then echo 'Good morning'; elif [ $h -lt 18 ]; then echo 'Good afternoon'; else echo 'Good evening'; fi), nixdt1"
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    color = rgba(a6adc8ff)
    position = 0, 150
    halign = center
    valign = center
}

# ── Clock ─────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    font_size = 88
    font_family = JetBrainsMono Nerd Font
    color = rgba(cdd6f4ff)
    position = 0, 60
    halign = center
    valign = center
}

# ── Date ──────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    color = rgba(9399b2ff)
    position = 0, 0
    halign = center
    valign = center
}

# ── Now playing (blank when nothing is playing) ───────────────────
label {
    monitor =
    text = cmd[update:2000] echo "$(playerctl -a metadata --format '  {{artist}} — {{title}}' 2>/dev/null | head -1)"
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    color = rgba(89b4faff)
    position = 0, -40
    halign = center
    valign = center
}

# ── Password field ────────────────────────────────────────────────
input-field {
    monitor =
    size = 320, 55
    position = 0, -120
    halign = center
    valign = center
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(89b4faff)
    inner_color = rgba(1e1e2ecc)
    font_color = rgba(cdd6f4ff)
    check_color = rgba(a6e3a1ff)
    fail_color = rgba(f38ba8ff)
    placeholder_text = <i>Password…</i>
    fail_text = <i>Nope — $ATTEMPTS</i>
    fade_on_empty = false
    rounding = 14
}
