################################################################################
# Hyprland config — tuned for this NixOS machine.
# Programs referenced here are all installed via /etc/nixos/configuration.nix.
# Wiki: https://wiki.hypr.land/Configuring/
################################################################################

################
### MONITORS ###
################
# See https://wiki.hypr.land/Configuring/Monitors/
monitor=,preferred,auto,auto


###################
### MY PROGRAMS ###
###################
$terminal    = foot
$fileManager = nautilus
$menu        = rofi -show drun
$lock        = ~/.config/hypr/scripts/lock.sh   # grabs a live-wallpaper frame, then hyprlock
$browser     = librewolf


#################
### AUTOSTART ###
#################
# Everything needed for a working desktop: bar, wallpaper, notifications,
# auth-prompt agent, idle daemon, and clipboard history.
exec-once = systemctl --user import-environment PATH
exec-once = ~/.config/hypr/scripts/wallpaper-cycle.sh
exec-once = ~/.config/hypr/scripts/waybar-hover.sh
# desktop dashboard: system monitor + music player, toggled by Super+M
exec-once = ~/.config/hypr/scripts/dashboard.sh open
exec-once = mako
exec-once = systemctl --user start hyprpolkitagent
exec-once = hypridle
# clamshell policy: external plugged in -> use only the external (laptop panel off)
exec-once = ~/.config/hypr/scripts/monitor-policy.sh
# KVM switch-back: kick DP-1 if the adapter fails to retrain (else: no signal)
exec-once = ~/.config/hypr/scripts/dp1-hotplug-kick.sh
# KVM switch-back: a replugged keyboard starts on au — put it on the current layout
exec-once = ~/.config/hypr/scripts/kb-layout.sh watch
exec-once = nm-applet --indicator
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = voxtype daemon


#############################
### ENVIRONMENT VARIABLES ###
#############################
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
# Sensible Wayland defaults for toolkits
env = NIXOS_OZONE_WL,1
env = MOZ_ENABLE_WAYLAND,1
env = QT_QPA_PLATFORM,wayland;xcb
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto


#####################
### LOOK AND FEEL ###
#####################
general {
    gaps_in = 4
    gaps_out = 6
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        noise = 0.015
        contrast = 0.9
        brightness = 0.85
        vibrancy = 0.2
    }
}

animations {
    enabled = yes, please :)

    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    animation = global,        1, 10,   default
    animation = border,        1, 5.39, easeOutQuint
    animation = windows,       1, 4.79, easeOutQuint
    animation = windowsIn,     1, 4.1,  easeOutQuint, popin 87%
    animation = windowsOut,    1, 1.49, linear,       popin 87%
    animation = fadeIn,        1, 1.73, almostLinear
    animation = fadeOut,       1, 1.46, almostLinear
    animation = fade,          1, 3.03, quick
    animation = layers,        1, 3.81, easeOutQuint
    animation = layersIn,      1, 4,    easeOutQuint, fade
    animation = layersOut,     1, 1.5,  linear,       fade
    animation = fadeLayersIn,  1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces,    1, 2.6, easeOutQuint, slide
    animation = workspacesIn,  1, 2.6, easeOutQuint, slide
    animation = workspacesOut, 1, 2.6, easeOutQuint, slide
    animation = zoomFactor,    1, 7,    quick
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}


#############
### INPUT ###
#############
input {
    kb_layout = au,rs,rs
    kb_variant = ,latin,
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
}

gesture = 3, horizontal, workspace


###################
### KEYBINDINGS ###
###################
$mainMod = SUPER

# Core
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreen, 1
bind = $mainMod, L, exec, $lock
bind = $mainMod SHIFT, C, exec, ~/.config/hypr/scripts/caffeine.sh
bind = $mainMod SHIFT, M, exit,
# Alt+Shift: next keyboard layout, on all keyboards at once
# (bindn: the keys still reach the app; code:64 = left Alt, which is Meta_L under Shift)
bindn = ALT, Shift_L, exec, ~/.config/hypr/scripts/kb-layout.sh
bindn = ALT, Shift_R, exec, ~/.config/hypr/scripts/kb-layout.sh
bindn = SHIFT, code:64, exec, ~/.config/hypr/scripts/kb-layout.sh
# Show this keybind cheatsheet (parsed live from the config)
bind = $mainMod, F1, exec, ~/.config/hypr/scripts/keybinds.sh

# Clipboard history via rofi
bind = $mainMod, H, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy

# Cycle animated wallpaper: next / previous
bind = $mainMod SHIFT, period, exec, ~/.config/hypr/scripts/wallpaper-ctl.sh next
bind = $mainMod SHIFT, comma,  exec, ~/.config/hypr/scripts/wallpaper-ctl.sh prev

# Move focus
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# Move windows
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d

# Resize the split (move the divider off-center) — hold to repeat
binde = $mainMod CTRL, left,  resizeactive, -40 0
binde = $mainMod CTRL, right, resizeactive,  40 0
binde = $mainMod CTRL, up,    resizeactive,  0 -40
binde = $mainMod CTRL, down,  resizeactive,  0  40

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Minimize: stash focused window to a hidden workspace; peek/restore the stash
bind = $mainMod, Z, movetoworkspacesilent, special:minimized
bind = $mainMod SHIFT, Z, togglespecialworkspace, minimized

# Toggle the eww desktop stats widget (show/hide)
bind = $mainMod, M, exec, ~/.config/hypr/scripts/dashboard.sh toggle

# Scratchpad
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Dictation: hold the rear MX Vertical thumb button (mouse:275, normally "back"), talk, release to type
bind  = , mouse:275, exec, voxtype record start
bindr = , mouse:275, exec, voxtype record stop

# Screenshots (grimblast -> clipboard + file in ~/Pictures/Screenshots)
bind = , Print,            exec, grimblast --notify copysave area
bind = SHIFT, Print,       exec, grimblast --notify copysave screen
bind = $mainMod, Print,    exec, grimblast --notify copy active
# Annotate the last region screenshot
bind = $mainMod SHIFT, Print, exec, grimblast --notify copy area && wl-paste | swappy -f -

# Screen recording with desktop audio (toggle: pick region -> record -> press again to stop)
bind = $mainMod SHIFT, R, exec, ~/.config/hypr/scripts/record.sh

# Audio / brightness (repeat while held via bindel; lock-screen-safe via bindl)
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Media keys
bindl = , XF86AudioNext,  exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioPrev,  exec, playerctl previous


##############################
### WINDOWS AND WORKSPACES ###
##############################
# Ignore maximize requests from apps.
windowrule = suppressevent maximize, class:.*
# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
# Float common dialogs / utilities
windowrule = float, class:^(pavucontrol)$
windowrule = float, class:^(nm-connection-editor)$
windowrule = float, class:^(org.gnome.Nautilus)$, title:^(.*Properties.*)$
windowrule = float, class:^(1Password)$
windowrule = float, title:^(Picture-in-Picture)$
windowrule = pin,   title:^(Picture-in-Picture)$
