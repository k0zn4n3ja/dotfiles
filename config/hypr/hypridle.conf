general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid duplicate lock instances
    before_sleep_cmd = loginctl lock-session      # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on    # wake displays on resume
}

# Dim / lock / sleep timeline (seconds)
listener {
    timeout = 300                                 # 5 min -> lock
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330                                 # 5.5 min -> screen off
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 1800                                # 30 min -> suspend
    on-timeout = systemctl suspend
}
