general {
    lock_cmd = pidof hyprlock || ~/.config/hypr/scripts/lock.sh   # refresh live-wallpaper bg, then lock
    before_sleep_cmd = loginctl lock-session      # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on    # wake displays on resume
}

# Dim / lock / sleep timeline (seconds).
# Every idle action is routed through idle-guard.sh, which SKIPS it while on AC
# power ("plugged in") -> no lock, no screen-off, no suspend at a desk. On
# battery the guard is a no-op passthrough, so the timeline works as normal.
# battery timeline is deliberately long: this machine sits folded on a stand
# behind a KVM, idle for hours while the other laptop is in use. Locking at
# 5 min / suspending at 30 made it unreachable without opening the lid.
listener {
    timeout = 3600                                # 60 min -> lock (battery only)
    on-timeout = ~/.config/hypr/scripts/idle-guard.sh loginctl lock-session
}

listener {
    timeout = 14340                               # 3h59m -> screen off (battery only)
    on-timeout = ~/.config/hypr/scripts/idle-guard.sh hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 14400                               # 4 hours -> suspend (battery only)
    on-timeout = ~/.config/hypr/scripts/idle-guard.sh systemctl suspend
}
