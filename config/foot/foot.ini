# foot terminal — Catppuccin Mocha, translucent (Hyprland blur does the "fog")
font=JetBrainsMono Nerd Font:size=11
line-height=18
dpi-aware=yes
pad=16x16
initial-window-size-chars=110x30

[cursor]
style=beam
blink=yes

[mouse]
hide-when-typing=yes

[colors]
# 0.0 = fully see-through, 1.0 = opaque. Lower = foggier.
alpha=0.80

background=1e1e2e
foreground=cdd6f4

## normal
regular0=45475a
regular1=f38ba8
regular2=a6e3a1
regular3=f9e2af
regular4=89b4fa
regular5=f5c2e7
regular6=94e2d5
regular7=bac2de

## bright
bright0=585b70
bright1=f38ba8
bright2=a6e3a1
bright3=f9e2af
bright4=89b4fa
bright5=f5c2e7
bright6=94e2d5
bright7=a6adc8

selection-foreground=1e1e2e
selection-background=f5e0dc
